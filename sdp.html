function reportMetrics(customers){
 const provinces=new Map(),sales=new Map(),products=new Map(),statuses=new Map(CUSTOMER_STATUSES.map(status=>[status,0]));
 let expected=0,actual=0,closed=0;
 customers.forEach(customer=>{
  const status=customerStatus(customer.status),customerExpected=sum(customer,'expected'),customerActual=sum(customer,'actual');
  expected+=customerExpected;actual+=customerActual;statuses.set(status,(statuses.get(status)||0)+1);
  if(status==='ปิดการขาย')closed++;
  const province=customer.province||'ไม่ระบุจังหวัด',sale=customer.sale||'ไม่ระบุ Sale';
  const provinceRow=provinces.get(province)||{name:province,customers:0,expected:0,actual:0};
  provinceRow.customers++;provinceRow.expected+=customerExpected;provinceRow.actual+=customerActual;provinces.set(province,provinceRow);
  const saleRow=sales.get(sale)||{name:sale,customers:0,expected:0,actual:0};
  saleRow.customers++;saleRow.expected+=customerExpected;saleRow.actual+=customerActual;sales.set(sale,saleRow);
  (customer.items||[]).forEach(item=>{
   const name=item.product||item.code||'ไม่ระบุสินค้า',product=products.get(name)||{name,expected:0,actual:0,packs:0};
   product.expected+=Number(item.expected)||0;product.actual+=Number(item.actual)||0;product.packs+=Number(item.packs)||0;products.set(name,product);
  });
 });
 return {customerCount:customers.length,expected,actual,closed,statuses:[...statuses].map(([name,count])=>({name,count})),provinces:[...provinces.values()].sort((a,b)=>b.actual-a.actual),sales:[...sales.values()].sort((a,b)=>b.actual-a.actual),products:[...products.values()].sort((a,b)=>b.actual-a.actual||b.expected-a.expected)};
}
function reportBars(rows,valueKey,maxValue){

 const max=maxValue||Math.max(...rows.map(row=>row[valueKey]),1);
 return `<div class="report-list">${rows.map(row=>`<div class="report-row"><span class="report-name" title="${esc(row.name)}">${esc(row.name)}</span><span class="report-track"><span style="width:${Math.max(row[valueKey]?2:0,row[valueKey]/max*100)}%"></span></span><span class="report-value">${valueKey==='customers'?fm(row[valueKey])+' ราย':'฿'+fm(row[valueKey])}</span></div>`).join('')}</div>`;
}
function filterReportProducts(products){
 const query=S.productQuery.trim().toLocaleLowerCase('th');
 const filtered=products.filter(product=>product.name.toLocaleLowerCase('th').includes(query));
 if(S.productSort==='expected')filtered.sort((a,b)=>b.expected-a.expected||b.actual-a.actual);
 else if(S.productSort==='name')filtered.sort((a,b)=>a.name.localeCompare(b.name,'th'));
 else filtered.sort((a,b)=>b.actual-a.actual||b.expected-a.expected);
 return filtered;
}

function cacheSnapshot(snapshot){
 const serialized=JSON.stringify(snapshot);
 try{
  const previous=localStorage.getItem(STORAGE_KEY);
  if(previous&&previous!==serialized)localStorage.setItem(BACKUP_STORAGE_KEY,previous);
  localStorage.setItem(STORAGE_KEY,serialized);
  return true;
 }catch{return false}
}
async function writeDataFile(snapshot){
 const response=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshot)});
 const result=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(result.error||`HTTP ${response.status}`);
 return result;
}
async function saveLocal(){
 const snapshot={customers:S.cust,provinces:S.extra,updatedAt:new Date().toISOString()};
 const cacheOk=cacheSnapshot(snapshot);
 if(fileStorageReady){
  const write=fileSaveQueue.catch(()=>{}).then(()=>writeDataFile(snapshot));
  fileSaveQueue=write;
  try{const result=await write;fileStoragePath=result.path||fileStoragePath;fileStorageError='';return true}
  catch(error){fileStorageError=error.message||String(error);toast('บันทึกไฟล์ไม่สำเร็จ: '+fileStorageError);render();return false}
 }
 if(!cacheOk)toast('บันทึกข้อมูลไม่สำเร็จ: พื้นที่จัดเก็บของเบราว์เซอร์เต็ม');
 return cacheOk;
}
async function initializeFileStorage(){
 const localSnapshot=readLocal()||{customers:S.cust,provinces:S.extra};
 try{
  const response=await fetch('/api/data',{cache:'no-store'});
  if(response.status===404){
   const initial={customers:localSnapshot.customers,provinces:localSnapshot.provinces,updatedAt:localSnapshot.updatedAt||new Date().toISOString()};
   const result=await writeDataFile(initial);
   fileStoragePath=result.path||'';
   cacheSnapshot(initial);
  }else{
   if(!response.ok)throw new Error(`HTTP ${response.status}`);
   const result=await response.json(),savedData=result.data;
   if(!Array.isArray(savedData?.customers)||!Array.isArray(savedData?.provinces))throw new Error('รูปแบบไฟล์ข้อมูลไม่ถูกต้อง');
   fileStoragePath=result.path||'';
   const localTime=Date.parse(localSnapshot.updatedAt||'')||0,fileTime=Date.parse(savedData.updatedAt||'')||0;
   if(localTime>fileTime){
    const migrated=await writeDataFile(localSnapshot);
    fileStoragePath=migrated.path||fileStoragePath;
    S.cust=localSnapshot.customers;S.extra=localSnapshot.provinces;cacheSnapshot(localSnapshot);
   }else{
    S.cust=savedData.customers;S.extra=savedData.provinces;cacheSnapshot(savedData);
   }
   if(result.recoveredFromBackup)toast('กู้ข้อมูลจากไฟล์สำรองอัตโนมัติแล้ว');
  }
  fileStorageReady=true;
 }catch(error){
  fileStorageError=error.message||String(error);
  toast('ยังเชื่อมไฟล์ข้อมูลไม่ได้ ใช้ข้อมูลในเบราว์เซอร์ชั่วคราว: '+fileStorageError);
 }finally{
  persistenceReady=true;
  render();
 }
}
function exportCustomersExcel(){
  if (!window.XLSX) {
    toast('โหลด Excel library ไม่สำเร็จ');
    return;
  }

  const rows = [];
  rows.push(['ID','ชื่อลูกค้า','จังหวัด','โซน','Sale','สถานะ','กลุ่มลูกค้า','Pain Point','แนวทางแก้ไข/ต่อยอด','รหัสสินค้า','สินค้า','ราคา/แพ็ค','แพ็ค/สัปดาห์','ยอดคาดหวัง','ยอดจริง','สถานะสินค้า']);

  S.cust.forEach((customer, customerIndex) => {
    const list = customer.items && customer.items.length ? customer.items : [{ code: '', product: '', price: 0, packs: 0, expected: 0, actual: 0, status: '' }];
    list.forEach((item, itemIndex) => {
      rows.push([
        customer.id || `customer-${customerIndex + 1}`,
        customer.name || '',
        customer.province || '',
        customer.zone || '',
        customer.sale || '',
        customerStatus(customer.status) || '',
        customer.segment || '',
        customer.pain || '',
        customer.plan || '',
        item.code || '',
        item.product || '',
        item.price || 0,
        item.packs || 0,
        item.expected || 0,
        item.actual || 0,
        item.status || ''
      ]);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'SDP');
  XLSX.writeFile(wb, 'sdp-export.xlsx');
  toast('ส่งออก Excel เสร็จแล้ว');
}

function normalizeImportedCustomer(row) {
  const name = row['ชื่อลูกค้า'] || row.name || row.Customer || row['Customer Name'] || row['ชื่อ'];
  const province = row['จังหวัด'] || row.province || row.Province || '';
  const zone = row['โซน'] || row.zone || row.Zone || '';
  const sale = row['Sale'] || row.sale || row['Sales'] || '';
  const status = row['สถานะ'] || row.status || row.Status || 'ยังไม่ได้เสนอ';
  const segment = row['กลุ่มลูกค้า'] || row.segment || row.Segment || '';
  const pain = row['Pain Point'] || row.pain || row['ปัญหา'] || '';
  const plan = row['แนวทางแก้ไข/ต่อยอด'] || row.plan || row['แผน'] || '';
  const code = row['รหัสสินค้า'] || row.code || row.Code || '';
  const product = row['สินค้า'] || row.product || row.Product || '';
  const price = Number(row['ราคา/แพ็ค'] ?? row.price ?? row.Price ?? 0);
  const packs = Number(row['แพ็ค/สัปดาห์'] ?? row.packs ?? row.Packs ?? 0);
  const expected = Number(row['ยอดคาดหวัง'] ?? row.expected ?? row['Expected'] ?? (price * packs));
  const actual = Number(row['ยอดจริง'] ?? row.actual ?? row['Actual'] ?? 0);
  const itemStatus = row['สถานะสินค้า'] || row.itemStatus || row['Item Status'] || '';
  return { name, province, zone, sale, status, segment, pain, plan, code, product, price, packs, expected, actual, itemStatus };
}

function importCustomersExcel(file) {
  if (!file || !window.XLSX) {
    toast('ไฟล์ Excel หรือ Excel library ไม่พร้อม');
    return;
  }

  const reader = new FileReader();
  reader.onload = async (event) => {
    try {
      const data = new Uint8Array(event.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });

      if (!rows.length) {
        toast('ไฟล์ Excel ว่าง');
        return;
      }

      const groups = new Map();

      rows.forEach((row, index) => {
        const normalized = normalizeImportedCustomer(row);
        const key = (
          row.ID || row.id || row['ID'] ||
          `${normalized.name || 'customer'}-${normalized.province || 'x'}-${normalized.zone || 'x'}-${index}`
        );

        if (!normalized.name && !normalized.product && !normalized.code) return;

        if (!groups.has(key)) {
          groups.set(key, {
            id: String(row.ID || row.id || row['ID'] || `n${Date.now()}${index}`),
            name: normalized.name || 'ลูกค้าใหม่',
            province: normalized.province || '',
            zone: normalized.zone || '',
            sale: normalized.sale || '',
            status: customerStatus(normalized.status || 'ยังไม่ได้เสนอ'),
            segment: normalized.segment || '',
            pain: normalized.pain || '',
            plan: normalized.plan || '',
            items: []
          });
        }

        const customer = groups.get(key);
        if (normalized.product || normalized.code || normalized.price || normalized.packs || normalized.expected || normalized.actual || normalized.itemStatus) {
          customer.items.push({
            code: String(normalized.code || ''),
            product: String(normalized.product || ''),
            price: Number(normalized.price || 0),
            packs: Number(normalized.packs || 0),
            expected: Number(normalized.expected || (Number(normalized.price || 0) * Number(normalized.packs || 0))),
            actual: Number(normalized.actual || 0),
            status: normalized.itemStatus || ''
          });
        }
      });

      const imported = [...groups.values()].map((customer, idx) => ({
        ...customer,
        id: customer.id || `n${Date.now()}${idx}`,
        items: customer.items.length ? customer.items : []
      }));

      if (!imported.length) {
        toast('ไม่พบข้อมูลลูกค้าในไฟล์');
        return;
      }

      S.cust = imported;
      S.prov = 'ทั้งหมด';
      const saved=await saveLocal();
      render();
      if(!saved)return;
      toast(`นำเข้าข้อมูล Excel แล้ว ${imported.length} ราย`);
    } catch (error) {
      toast('อ่านไฟล์ Excel ไม่สำเร็จ: ' + (error.message || error));
    }
  };

  reader.readAsArrayBuffer(file);
}

async function put(c){
  try {
    if (S.src === 'local') {
      const index = S.cust.findIndex(x => x.id === c.id);
      if (index < 0) S.cust.push(c); else S.cust[index] = c;
      const saved=await saveLocal();
      render();
      return saved;
    }

    if (window.supabase && S.can && S.db) {
      const { error } = await window.supabase.from('customers').upsert({ ...c, id: c.id }, { onConflict: 'id' });
      if (error) throw error;
      render();
      return true;
    }

    if (S.db && typeof S.db.doc === 'function') {
      await S.db.doc('customers/' + c.id).set(c);
      render();
      return true;
    }
  } catch (e) {
    toast('บันทึกไม่สำเร็จ: ' + (e.message || e.code || e));
    return false;
  }
}
const byId=id=>S.cust.find(c=>c.id===id);
const CF=[{k:'name',l:'ชื่อลูกค้า',w:1},{k:'province',l:'จังหวัด',d:'dp'},{k:'zone',l:'พื้นที่/โซน'},{k:'sale',l:'Sale ที่ดูแล',d:'ds'},{k:'status',l:'สถานะ',o:CUSTOMER_STATUSES},{k:'segment',l:'กลุ่มลูกค้า'},{k:'pain',l:'Pain Point',a:1,w:1},{k:'plan',l:'แนวทางแก้ไข/ต่อยอด',a:1,w:1}];
const IF=[{k:'code',l:'รหัสสินค้า'},{k:'product',l:'ชื่อสินค้า'},{k:'price',l:'ราคา/แพ็ค (฿)',n:1},{k:'packs',l:'แพ็ค/สัปดาห์',n:1},{k:'expected',l:'ยอดคาดหวัง ฿/สัปดาห์ (ราคา × แพ็ค)',n:1,w:1,ro:1},{k:'actual',l:'ยอดจริง ฿/สัปดาห์',n:1},{k:'status',l:'สถานะ',d:'dt'}];
function itemForm(c,x){const it=x==null?{code:'',product:'',price:0,packs:0,expected:0,actual:0,status:''}:c.items[x];
 const initial={...it,expected:Math.round((Number(it.price)||0)*(Number(it.packs)||0)*100)/100};
 form(x==null?'เพิ่มสินค้า':'แก้ไขสินค้า',IF,initial,o=>{if(!o.product){toast('กรุณาใส่ชื่อสินค้า');return false}o.expected=Math.round(o.price*o.packs*100)/100;if(x==null)c.items.push(o);else c.items[x]=o;put(c)})}
function productVariantKey(item){return JSON.stringify([String(item.code||''),String(item.product||''),Number(item.price)||0])}
function updatePickerCount(){
 const selected=document.querySelectorAll('#productPickerList [data-product-check]:checked').length;
 const count=document.getElementById('productPickerSelectedCount');
 if(count)count.textContent=`เลือก ${fm(selected)} รายการ`;
}
function filterPickerRows(query){
 const value=String(query||'').trim().toLocaleLowerCase('th');
 document.querySelectorAll('#productPickerList [data-picker-row]').forEach(row=>{row.hidden=!!value&&!row.dataset.searchText.includes(value)});
}
function productCatalog(){
 const items=[];
 S.cust.forEach(customer=>(customer.items||[]).forEach(item=>{
  if(!item.product&&!item.code)return;
  items.push({code:String(item.code||''),product:String(item.product||''),price:Number(item.price)||0});
 }));
 const codedNamePrices=new Set(items.filter(item=>item.code).map(item=>JSON.stringify([item.product,item.price])));
 const catalog=new Map();
 items.forEach(item=>{
  if(!item.code&&codedNamePrices.has(JSON.stringify([item.product,item.price])))return;
  const key=productVariantKey(item);
  if(!catalog.has(key))catalog.set(key,{...item,key});
 });
 return [...catalog.values()].sort((a,b)=>a.product.localeCompare(b.product,'th')||a.code.localeCompare(b.code,'th')||a.price-b.price);
}
function productPicker(customer){
 const catalog=productCatalog(),existing=customer.items||[],picker=$('#m');
 if(!catalog.length){itemForm(customer,null);return}
 picker.innerHTML=`<div class="box picker-box"><h3>เลือกสินค้าสำหรับ ${esc(customer.name)}</h3><p class="picker-intro">ติ๊กสินค้าที่ต้องการ แล้วกรอกจำนวนแพ็คต่อสัปดาห์ ระบบเติมรหัส ชื่อ และราคาจากรายการเดิมให้</p><div class="picker-tools"><input type="search" aria-label="ค้นหาในรายการสินค้า" placeholder="ค้นหาชื่อหรือรหัสสินค้า…"><small id="productPickerSelectedCount">เลือก 0 รายการ</small></div><div id="productPickerList" class="picker-list">${catalog.map((item,index)=>{
  const alreadyAdded=existing.some(current=>productVariantKey(current)===item.key||(String(current.product||'')===item.product&&(Number(current.price)||0)===item.price&&(!current.code||!item.code))),searchText=`${item.product} ${item.code} ${item.price}`.toLocaleLowerCase('th');
  return `<div class="picker-row" data-picker-row data-search-text="${esc(searchText)}"><input id="pick_${index}" type="checkbox" data-product-check="${index}" ${alreadyAdded?'disabled':''}><label class="picker-product" for="pick_${index}"><b>${esc(item.product||'ไม่ระบุชื่อสินค้า')}</b><small>รหัส ${esc(item.code||'-')} · ฿${Number(item.price).toLocaleString('th-TH',{maximumFractionDigits:2})}/แพ็ค${alreadyAdded?' · เพิ่มในลูกค้ารายนี้แล้ว':''}</small></label><input type="number" min="0" step="any" placeholder="แพ็ค/สัปดาห์" aria-label="จำนวนแพ็ค ${esc(item.product)}" data-product-packs="${index}" disabled></div>`;
 }).join('')}</div><div class="picker-footer"><span class="mu">${fm(catalog.length)} รายการสินค้า</span><button type="button" data-act="x">ยกเลิก</button><button type="button" data-act="manual-product" data-id="${esc(customer.id)}">+ สินค้าใหม่</button><button type="button" class="pri" data-act="save-selected-products" data-id="${esc(customer.id)}">เพิ่มสินค้าที่เลือก</button></div></div>`;
 picker.hidden=false;
 picker.querySelector('.picker-tools input').addEventListener('input',event=>filterPickerRows(event.target.value));
 picker.querySelectorAll('[data-product-check]').forEach(check=>check.addEventListener('change',()=>{
  const quantity=picker.querySelector(`[data-product-packs="${check.dataset.productCheck}"]`);
  quantity.disabled=!check.checked;
  if(check.checked)quantity.focus();
  updatePickerCount();
 }));
 picker.querySelector('[data-act="save-selected-products"]').addEventListener('click',async()=>{
  const selected=[...picker.querySelectorAll('[data-product-check]:checked')];
  if(!selected.length){toast('เลือกสินค้าอย่างน้อย 1 รายการ');return}
  const additions=[];
  for(const check of selected){
   const item=catalog[Number(check.dataset.productCheck)],packs=Number(picker.querySelector(`[data-product-packs="${check.dataset.productCheck}"]`).value);
   if(!Number.isFinite(packs)||packs<=0){toast(`กรุณากรอกจำนวนแพ็คของ ${item.product}`);return}
   additions.push({code:item.code,product:item.product,price:item.price,packs,expected:Math.round(item.price*packs*100)/100,actual:0,status:''});
  }
  customer.items.push(...additions);
  if(await put(customer)){picker.hidden=true;toast(`เพิ่มสินค้าแล้ว ${additions.length} รายการ`)}
 });
}
function custForm(c){const n=!c;c=c||{id:'n'+Date.now(),name:'',province:S.prov==='ทั้งหมด'?'':S.prov,zone:'',sale:'',status:'ยังไม่ได้เสนอ',segment:'',pain:'',plan:'',items:[]};
 form(n?'เพิ่มลูกค้า':'แก้ไขลูกค้า',CF,{...c,status:customerStatus(c.status)},o=>{if(!o.name||!o.province){toast('ต้องมีชื่อลูกค้าและจังหวัด');return false}put({...c,...o});S.open.add(c.id)})}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,c=byId(b.dataset.id),i=b.dataset.i;
 if(!persistenceReady&&['save-local','import-xlsx','ac','ap','ai','manual-product','save-selected-products','ei','di','ec','dc','close'].includes(a)){toast('กำลังโหลดข้อมูลที่บันทึกไว้ กรุณารอสักครู่');return}
 if(a==='x'){$('#m').hidden=true}
 else if(a==='ok'){if(await OK(M())!==false)$('#m').hidden=true}
 else if(a==='tab'){S.view=b.dataset.view;render()}
 else if(a==='clear-report-filters'){S.dashProv='';S.dashSale='';S.dashStatus='';render()}
 else if(a==='tog'){S.open.has(c.id)?S.open.delete(c.id):S.open.add(c.id);render()}
 else if(a==='prov'){S.prov=b.dataset.p;render()}
 else if(a==='save-local'){if(await saveLocal())toast(fileStorageReady?'บันทึกลงไฟล์ในเครื่องแล้ว':'บันทึกลงเบราว์เซอร์แล้ว');return;}
 else if(a==='export-xlsx'){exportCustomersExcel();}
 else if(a==='import-xlsx'){triggerExcelImport();}
 else if(a==='ac'||a==='ap'||a==='ai'||a==='manual-product'||a==='ei'||a==='di'||a==='ec'||a==='dc'||a==='close'||a==='imp'){
  if(a!=='imp'&&!canW()){toast('ต้องนำเข้าข้อมูลลงฐานข้อมูลและมีสิทธิ์แก้ไขก่อน');return}
  if(a==='ac')custForm();
  else if(a==='close'){c.status='ปิดการขาย';put(c)}
    else if(a==='ap')form('เพิ่มจังหวัด',[{k:'n',l:'ชื่อจังหวัด',w:1}],{n:''},async o=>{if(!o.n)return false;try{S.extra=[...new Set([...S.extra,o.n])];if(S.src==='db')await S.db.doc('meta/settings').set({provinces:S.extra});else await saveLocal();S.prov=o.n;render()}catch(e){toast('บันทึกไม่สำเร็จ')}})
  else if(a==='ai')productPicker(c);else if(a==='manual-product')itemForm(c,null);else if(a==='ei')itemForm(c,+i);else if(a==='ec')custForm(c);
  else if(a==='di')form('ลบสินค้า',[],{},()=>{c.items.splice(+i,1);put(c)},`ลบ "${esc(c.items[+i].product)}" ออกจาก ${esc(c.name)}?`);
    else if(a==='dc')form('ลบลูกค้า',[],{},async()=>{if(S.src==='local'){S.cust=S.cust.filter(x=>x.id!==c.id);await saveLocal();render()}else try{await S.db.doc('customers/'+c.id).delete()}catch(e){toast('ลบไม่สำเร็จ')}},`ลบ "${esc(c.name)}" และสินค้าทั้งหมดของลูกค้ารายนี้?`);
  else if(a==='imp'){b.disabled=true;let n=0;for(const x of SEED){try{await S.db.doc('customers/'+x.id).set(x)}catch(e){toast('นำเข้าหยุดที่ '+n+' ราย: '+(e.message||e.code));return}n++;b.textContent='นำเข้า '+n+'/'+SEED.length}toast('นำเข้าครบ '+n+' ราย')}
 }});
document.getElementById('excelFileInput')?.addEventListener('change', (event) => {
  const file = event.target.files && event.target.files[0];
  if (file) importCustomersExcel(file);
  event.target.value = '';
});
document.addEventListener('input',ev=>{if(ev.target.matches('[data-product-filter]')){S.productQuery=ev.target.value;refreshProductTable()}else if(ev.target.id==='f_price'||ev.target.id==='f_packs'){const price=Number($('#f_price')?.value)||0,packs=Number($('#f_packs')?.value)||0,expected=$('#f_expected');if(expected)expected.value=(Math.round(price*packs*100)/100).toString()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.productFocus!==undefined){S.productFocus=t.value;renderDashboard()}else if(t.dataset.reportFilter){S[t.dataset.reportFilter]=t.value;render()}else if(t.dataset.act==='act'){if(!persistenceReady){toast('กำลังโหลดข้อมูลที่บันทึกไว้ กรุณารอสักครู่');return}const c=byId(t.dataset.id);c.items[+t.dataset.i].actual=+t.value||0;put(c)}else if(t.dataset.act==='cstatus'){if(!persistenceReady){toast('กำลังโหลดข้อมูลที่บันทึกไว้ กรุณารอสักครู่');return}const c=byId(t.dataset.id);if(c){c.status=t.value;put(c)}}});
document.addEventListener('change',ev=>{if(ev.target.matches('[data-product-sort]')){S.productSort=ev.target.value;refreshProductTable()}});
$('#q').oninput=e=>{S.q=e.target.value;render()};$('#fs').onchange=e=>{S.sale=e.target.value;render()};$('#ft').onchange=e=>{S.stt=e.target.value;render()};
if (!readLocal()) cacheSnapshot({customers:SEED,provinces:[]});
render();
initializeFileStorage();
</script></body></html>
